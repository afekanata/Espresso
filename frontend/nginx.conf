# nginx config for the Trial Issue Log frontend.
# - Serves the Vite static bundle at /
# - Reverse-proxies /api/* to the Nest container ("server" service in compose)
# - SPA fallback so client-side routes (e.g. /dashboard, /login) survive reload

server {
    listen 80;
    server_name _;

    # gzip what we can (small wins for the JS/CSS bundle)
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Backend proxy. `proxy_pass http://server:3000;` (no trailing slash) keeps
    # the full `/api/...` path intact — Nest is configured with `app.setGlobalPrefix('api')`
    # so it expects requests to arrive prefixed.
    location /api/ {
        proxy_pass http://server:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Long-lived cache for hashed assets (Vite emits content-hashed filenames).
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: serve index.html for any unknown path so React Router takes over.
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
